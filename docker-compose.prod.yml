volumes:
  mysql_data:
  romm_resources:
  romm_redis_data:
  romm_library:
  romm_assets:
  romm_config:

services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD= # set via Coolify env vars, not in git
      - ROMM_AUTH_SECRET_KEY= # set via Coolify env vars, not in git
      - HASHEOUS_API_ENABLED=true
      - SCAN_WORKERS=4
      - WEB_SERVER_CONCURRENCY=4
      - OIDC_ENABLED= # set via Coolify env vars, not in git
      - OIDC_PROVIDER= # set via Coolify env vars, not in git
      - OIDC_CLIENT_ID= # set via Coolify env vars, not in git
      - OIDC_CLIENT_SECRET= # set via Coolify env vars, not in git
      - OIDC_REDIRECT_URI= # set via Coolify env vars, not in git
      - OIDC_SERVER_METADATA_URL= # set via Coolify env vars, not in git
    volumes:
      - romm_resources:/romm/resources
      - romm_redis_data:/redis-data
      - romm_library:/romm/library
      - romm_assets:/romm/assets
      - romm_config:/romm/config
    expose:
      - "8080"
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD= # set via Coolify env vars, not in git
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD= # set via Coolify env vars, not in git
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
